[tool.poetry]
name = "faiss"
version = "0.1.0"
description = ""
authors = ["Vasily Sizov <siszovvasya@mail.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
torch = {version = "^2.5.1+cu121", source = "pytorch-gpu"}
torchvision = {version = "^0.20.1+cu121", source = "pytorch-gpu"}
torchaudio = {version = "^2.5.1+cu121", source = "pytorch-gpu"}
scikit-learn = "^1.6.1"
sentence-transformers = "^4.1.0"
tqdm = "^4.67.1"
pandas = "^2.2.3"
matplotlib = "^3.10.1"
transformers = "^4.51.3"
openpyxl = "^3.1.5"
datasets = "^3.5.1"
accelerate = ">=0.26.0"


[[tool.poetry.source]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu121"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100  # Максимальная длина строки — 79 символов, согласно PEP 8

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "myproject.settings"

[tool.isort]
py_version = 39  # Версия Python для сортировки импортов — 3.9
line_length = 100  # Максимальная длина строки для импортов — 79 символов
profile = "black"  # Совместимость с форматером Black, чтобы форматирование было единообразным
skip = [".gitignore", ".dockerignore"]  # Пропуск указанных файлов при сортировке импортов
extend_skip = [".md", ".json"]  # Пропуск файлов с расширениями .md и .json
src_paths = ["api_yamdb"]  # Основная директория проекта, из которой импортируются модули
multi_line_output = 3  # Форматирование многократных импортов (вывод в вертикальном виде)

[tool.flake8]
max-line-length = 100  # Максимальная длина строки для линтинга — 79 символов
max-complexity = 10  # Максимальная сложность кода (цикломатическая сложность)
ignore = [
    "W503",  # Перенос строки произошел перед бинарным оператором
    "F811",  # Переопределение имени (повторное определение переменной)
]
exclude = [
    "tests/",  # Исключение директории с тестами
    "*/migrations/",  # Исключение файлов миграций
    "venv/",  # Исключение директории виртуального окружения
    "env/"  # Исключение альтернативной директории виртуального окружения
]
per-file-ignores = [
    "settings.py:E501"  # Игнорировать длинные строки (E501) в settings.py
]
